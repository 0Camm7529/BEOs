<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEOs Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --bg-card-hover: rgba(51, 65, 85, 0.85);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 15% 15%, rgba(99, 102, 241, 0.18) 0px, transparent 50%),
                radial-gradient(at 85% 85%, rgba(16, 185, 129, 0.12) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        /* Header tiêu đề BEOs Studio */
        .header {
            margin-bottom: 35px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Tiêu đề danh mục */
        .category-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #cbd5e1;
        }

        .category-title i {
            color: var(--primary);
        }

        /* Danh sách ứng dụng dạng ô ngang */
        .app-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Thẻ ứng dụng thiết kế ngang */
        .app-card-horizontal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 24px;
            text-decoration: none;
            color: var(--text-main);
            backdrop-filter: blur(10px);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .app-card-horizontal:hover {
            background: var(--bg-card-hover);
            transform: translateX(6px);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 0 15px var(--primary-glow);
        }

        .app-icon {
            width: 50px;
            height: 50px;
            min-width: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            transition: transform 0.2s;
        }

        .app-card-horizontal:hover .app-icon {
            transform: scale(1.1);
        }

        .app-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .app-name {
            font-weight: 600;
            font-size: 1.05rem;
        }

        .app-desc {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .arrow-icon {
            color: var(--text-sub);
            font-size: 1rem;
            transition: transform 0.2s, color 0.2s;
        }

        .app-card-horizontal:hover .arrow-icon {
            transform: translateX(4px);
            color: var(--primary);
        }

        /* Màu biểu tượng Azota */
        .icon-azota { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header: Tiêu đề BEOs Studio -->
        <div class="header">
            <h1>BEOs Studio</h1>
        </div>

        <!-- Danh mục Ứng dụng -->
        <h2 class="category-title"><i class="fa-solid fa-cubes"></i> Ứng dụng</h2>
        
        <div class="app-list">
            <!-- Ô ngang: Azota -->
            <a href="https://azota.vn" target="_blank" class="app-card-horizontal">
                <div class="app-icon icon-azota"><i class="fa-solid fa-file-pen"></i></div>
                <div class="app-info">
                    <div class="app-name">Azota</div>
                    <div class="app-desc">Luyện đề & Nộp bài tập</div>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <!-- Thêm ứng dụng mới bằng cách nhân bản thẻ <a> dưới đây:
            <a href="LINK_DUNG_CUA_BAN" target="_blank" class="app-card-horizontal">
                <div class="app-icon icon-azota"><i class="fa-solid fa-icon"></i></div>
                <div class="app-info">
                    <div class="app-name">Tên Ứng Dụng</div>
                    <div class="app-desc">Mô tả ngắn</div>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>
            -->
        </div>
    </div>

</body>
</html>
