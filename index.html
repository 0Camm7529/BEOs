<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEOs Studio</title>
    <!-- Google Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-hover-bg: rgba(255, 255, 255, 0.06);
            --primary-accent: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Glow Background Effect */
        .ambient-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(168, 85, 247, 0.1) 40%, transparent 70%);
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 0;
            pointer-events: none;
            filter: blur(50px);
        }

        .container {
            width: 100%;
            max-width: 560px;
            position: relative;
            z-index: 1;
        }

        /* Header BEOs Studio */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .brand-title {
            font-size: 2.75rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .brand-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #a5b4fc;
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.25);
            padding: 4px 14px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .brand-tag::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #6366f1;
            border-radius: 50%;
            box-shadow: 0 0 8px #6366f1;
        }

        /* Section Title */
        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            padding: 0 4px;
        }

        .category-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-title i {
            color: var(--primary-accent);
            font-size: 1rem;
        }

        .app-count {
            font-size: 0.8rem;
            color: var(--text-dim);
            font-weight: 600;
        }

        /* Application List (Vertical Container for Horizontal Cards) */
        .app-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Sleek Horizontal Card Design */
        .app-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px 20px;
            text-decoration: none;
            color: var(--text-main);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        /* Hover Subtle Glow Line on Left Edge */
        .app-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 15%;
            height: 70%;
            width: 3px;
            background: var(--primary-accent);
            border-radius: 0 4px 4px 0;
            opacity: 0;
            transition: opacity 0.3s ease;
            box-shadow: 0 0 12px var(--primary-accent);
        }

        .app-card:hover {
            background: var(--card-hover-bg);
            border-color: rgba(99, 102, 241, 0.35);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.5), 0 0 20px rgba(99, 102, 241, 0.15);
        }

        .app-card:hover::before {
            opacity: 1;
        }

        /* Left Side Content Wrapper */
        .app-main-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* App Icon Styling */
        .app-icon-wrapper {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            position: relative;
            flex-shrink: 0;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .app-card:hover .app-icon-wrapper {
            transform: scale(1.08);
        }

        /* Icon Colors */
        .icon-azota {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(37, 99, 235, 0.1));
            color: #60a5fa;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        /* Text Block */
        .app-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .app-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.2px;
        }

        .app-description {
            font-size: 0.825rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Action / Arrow Button */
        .action-badge {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .app-card:hover .action-badge {
            background: var(--primary-accent);
            border-color: var(--primary-accent);
            color: #ffffff;
            transform: translateX(3px);
            box-shadow: 0 0 12px var(--primary-glow);
        }
    </style>
</head>
<body>

    <!-- Light Background Effect -->
    <div class="ambient-glow"></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1 class="brand-title">BEOs Studio</h1>
            <span class="brand-tag">Trung Tâm Ứng Dụng</span>
        </div>

        <!-- Section: Ứng dụng -->
        <div class="category-header">
            <h2 class="category-title">
                <i class="fa-solid fa-layer-group"></i> Ứng dụng
            </h2>
            <span class="app-count">1 ứng dụng</span>
        </div>

        <div class="app-list">
            <!-- Ô ngang: Azota -->
            <a href="https://azota.vn" target="_blank" class="app-card">
                <div class="app-main-info">
                    <div class="app-icon-wrapper icon-azota">
                        <i class="fa-solid fa-file-pen"></i>
                    </div>
                    <div class="app-text">
                        <span class="app-title">Azota</span>
                        <span class="app-description">Luyện đề & Nộp bài tập</span>
                    </div>
                </div>
                <div class="action-badge">
                    <i class="fa-solid fa-arrow-right"></i>
                </div>
            </a>

            <!-- 
            MẪU THÊM ỨNG DỤNG MỚI DỄ DÀNG:
            Chỉ cần nhân bản đoạn mã <a ...> bên dưới và thay thông tin:

            <a href="https://link-cua-ban.com" target="_blank" class="app-card">
                <div class="app-main-info">
                    <div class="app-icon-wrapper icon-azota">
                        <i class="fa-solid fa-bookmark"></i>
                    </div>
                    <div class="app-text">
                        <span class="app-title">Tên Ứng Dụng</span>
                        <span class="app-description">Mô tả ngắn ứng dụng</span>
                    </div>
                </div>
                <div class="action-badge">
                    <i class="fa-solid fa-arrow-right"></i>
                </div>
            </a>
            -->
        </div>
    </div>

</body>
</html>
