<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEOs Studio - Trung tâm ứng dụng</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-hover-bg: rgba(255, 255, 255, 0.06);
            --primary-accent: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        .ambient-glow {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(168, 85, 247, 0.08) 40%, transparent 70%);
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 0;
            pointer-events: none;
            filter: blur(80px);
        }

        .navbar {
            width: 100%;
            padding: 32px 48px;
            display: flex;
            align-items: center;
            z-index: 10;
        }

        .brand-logo-group {
            display: flex;
            align-items: center;
            gap: 16px;
            text-decoration: none;
        }

        .logo-box {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 6px;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 10px;
        }

        .brand-title {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 40%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .main-content {
            flex: 1;
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
            padding: 50px 24px 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 1;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 50px;
        }

        .hero-text {
            font-size: 1.85rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
            line-height: 1.4;
            background: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 0 6px;
        }

        .category-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .category-title i {
            color: var(--primary-accent);
            font-size: 1.2rem;
        }

        .app-count {
            font-size: 0.95rem;
            color: var(--text-dim);
            font-weight: 600;
        }

        .app-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .app-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 22px 28px;
            text-decoration: none;
            color: var(--text-main);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .app-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 15%;
            height: 70%;
            width: 4px;
            background: var(--primary-accent);
            border-radius: 0 4px 4px 0;
            opacity: 0;
            transition: opacity 0.3s ease;
            box-shadow: 0 0 14px var(--primary-accent);
        }

        .app-card:hover {
            background: var(--card-hover-bg);
            border-color: rgba(99, 102, 241, 0.35);
            transform: translateY(-3px);
            box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.5), 0 0 24px rgba(99, 102, 241, 0.15);
        }

        .app-card:hover::before {
            opacity: 1;
        }

        .app-main-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .app-icon-wrapper {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            flex-shrink: 0;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .app-card:hover .app-icon-wrapper {
            transform: scale(1.08);
        }

        .icon-azota {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(37, 99, 235, 0.1));
            color: #60a5fa;
            border: 1px solid rgba(99, 102, 241, 0.25);
        }

        .app-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .app-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .app-description {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .action-badge {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 1rem;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .app-card:hover .action-badge {
            background: var(--primary-accent);
            border-color: var(--primary-accent);
            color: #ffffff;
            transform: translateX(4px);
            box-shadow: 0 0 16px var(--primary-glow);
        }

        @media (max-width: 768px) {
            .navbar { padding: 20px 20px; }
            .logo-box { width: 44px; height: 44px; padding: 4px; }
            .brand-title { font-size: 1.35rem; }
            .main-content { justify-content: flex-start; padding: 15px 20px 40px; }
            .hero-section { text-align: left; margin-bottom: 30px; }
            .hero-text { font-size: 1.25rem; }
            .category-title { font-size: 1.1rem; }
            .app-card { padding: 16px 20px; border-radius: 18px; }
            .app-icon-wrapper { width: 46px; height: 46px; font-size: 1.3rem; border-radius: 14px; }
            .app-title { font-size: 1rem; }
            .app-description { font-size: 0.85rem; }
            .action-badge { width: 36px; height: 36px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <header class="navbar">
        <a href="index.html" class="brand-logo-group">
            <div class="logo-box">
                <img src="https://i.ibb.co/wZCvWpt4/file-000000007c6071fa9e41573272c5624a.png" alt="BEOs Studio Logo" class="logo-img">
            </div>
            <span class="brand-title">BEOs Studio</span>
        </a>
    </header>

    <main class="main-content">
        <div class="hero-section">
            <p class="hero-text">Trung tâm chuyển hướng tới các ứng dụng</p>
        </div>

        <div class="category-header">
            <h2 class="category-title">
                <i class="fa-solid fa-layer-group"></i> Ứng dụng
            </h2>
            <span class="app-count">1 ứng dụng</span>
        </div>

        <div class="app-list">
            <!-- ĐƯỜNG DẪN MỚI: Trỏ tới thư mục azota/index.html -->
            <a href="azota/index.html" class="app-card">
                <div class="app-main-info">
                    <div class="app-icon-wrapper icon-azota">
                        <i class="fa-solid fa-file-pen"></i>
                    </div>
                    <div class="app-text">
                        <span class="app-title">Azota</span>
                        <span class="app-description">Luyện đề & Ôn tập</span>
                    </div>
                </div>
                <div class="action-badge">
                    <i class="fa-solid fa-arrow-right"></i>
                </div>
            </a>
        </div>
    </main>

</body>
</html>
