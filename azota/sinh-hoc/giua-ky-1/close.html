<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đề ôn đã đóng | BEOs Studio</title>
    <!-- Google Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-accent: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Ambient Glow Effect */
        .ambient-glow {
            position: fixed;
            width: 100%;
            max-width: 500px;
            height: 300px;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.15) 0%, rgba(99, 102, 241, 0.08) 50%, transparent 80%);
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 0;
            pointer-events: none;
            filter: blur(60px);
        }

        /* Header Navbar */
        .navbar {
            width: 100%;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
            border-bottom: 1px solid var(--card-border);
            background: rgba(11, 15, 25, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
        }

        .brand-logo-group {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-box {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 4px;
            flex-shrink: 0;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 6px;
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.4px;
            background: linear-gradient(135deg, #ffffff 40%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Main Container */
        .main-content {
            flex: 1;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .status-card {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 36px 24px;
            text-align: center;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .icon-box {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.25);
            color: #fbbf24;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            margin-bottom: 4px;
        }

        .status-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.4;
        }

        .status-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .back-btn-main {
            margin-top: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
            width: 100%;
            max-width: 260px;
        }

        .back-btn-main:active, .back-btn-main:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            transform: scale(0.98);
        }

        .footer {
            margin-top: auto;
            padding: 24px 16px 20px;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.725rem;
            font-weight: 500;
            z-index: 1;
            line-height: 1.5;
            width: 100%;
        }

        @media (min-width: 641px) {
            .navbar { padding: 20px 40px; }
            .brand-title { font-size: 1.4rem; }
            .main-content { padding: 40px 20px; }
            .status-card { padding: 48px 32px; }
            .status-title { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <!-- Header Navbar -->
    <header class="navbar">
        <a href="../index.html" class="brand-logo-group">
            <div class="logo-box">
                <img src="https://i.ibb.co/wZCvWpt4/file-000000007c6071fa9e41573272c5624a.png" alt="BEOs Logo" class="logo-img">
            </div>
            <span class="brand-title">BEOs Studio</span>
        </a>
    </header>

    <!-- Nội dung thông báo -->
    <main class="main-content">
        <div class="status-card">
            <div class="icon-box">
                <i class="fa-solid fa-folder-closed"></i>
            </div>
            <h1 class="status-title">Đề ôn này đã đóng</h1>
            <p class="status-desc">Đề ôn tập này hiện không còn khả dụng.</p>
            
            <!-- Thẻ a này trỏ về trang chọn đề (lùi 1 cấp thư mục ../index.html) -->
            <a href="../index.html" class="back-btn-main">
                <i class="fa-solid fa-arrow-left"></i> Quay về trang chọn đề
            </a>
        </div>
    </main>

    <!-- Footer Copyright -->
    <footer class="footer">
        <p>© 2026 BEOs Studio. Bản quyền thuộc về BEOs Studio. Design UX/UI by AI.</p>
    </footer>

</body>
</html>
